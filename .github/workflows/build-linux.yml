name: Build Linux Release (Manual)

on:
  workflow_dispatch: # Pemicu manual dari tab GitHub Actions
    inputs:
      release_note:
        description: 'Catatan Rilis (Opsional)'
        required: false
        default: 'Manual Linux Build'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Linux Application (.AppImage & .deb)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx vue-tsc
          npx vite build
          npx electron-builder --linux AppImage deb --publish never

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Glide-Installer
          path: |
            dist-app/*.AppImage
            dist-app/*.deb
          retention-days: 7
