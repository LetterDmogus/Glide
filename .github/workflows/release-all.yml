name: Publish Multi-Platform Release

on:
  push:
    tags:
      - 'v*' # Otomatis berjalan saat push tag baru (v2.0.0, v2.0.1, dst)
  workflow_dispatch: # Pemicu manual dari tab GitHub Actions
    inputs:
      tag_name:
        description: 'Tag Versi Rilis (contoh: v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  publish:
    name: Build & Publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Desktop Application
        run: |
          npx vue-tsc
          npx vite build
          npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: Release ${{ inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            dist-app/*.exe
            dist-app/*.dmg
            dist-app/*.zip
            dist-app/*.AppImage
            dist-app/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
