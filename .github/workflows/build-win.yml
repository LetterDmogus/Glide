name: Build Windows Release (Manual)

on:
  workflow_dispatch: # Pemicu manual dari tab GitHub Actions
    inputs:
      release_note:
        description: 'Catatan Rilis (Opsional)'
        required: false
        default: 'Manual Windows Build'

jobs:
  build-win:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Windows Application (.exe Setup)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx vue-tsc
          npx vite build
          npx electron-builder --win --publish never

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Glide-Installer
          path: |
            dist-app/*.exe
            dist-app/*.blockmap
          retention-days: 7
