name: Build macOS Release (Manual)

on:
  workflow_dispatch: # Pemicu manual dari tab GitHub Actions
    inputs:
      release_note:
        description: 'Catatan Rilis (Opsional)'
        required: false
        default: 'Manual macOS Build'

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build macOS Application (.dmg / .zip)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx vue-tsc
          npx vite build
          npx electron-builder --mac dmg zip --publish never

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Glide-Installer
          path: |
            dist-app/*.dmg
            dist-app/*.zip
          retention-days: 7
